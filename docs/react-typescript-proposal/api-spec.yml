openapi: 3.0.3

info:
  title: VES — Contrato propuesto para documentos STI
  version: 0.2.0
  description: |
    Contrato OpenAPI objetivo de la migración incremental del módulo de documentos STI de VES.
    No acredita endpoints desplegados ni sustituye las convenciones y rutas/versionado efectivos
    de Bccr.Supen.Ves.Api y Bccr.Supen.Ves.Mapi; validar antes de implementar.

    Arquitectura objetivo: Bccr.Supen.Ves.UI (React 19, JavaScript/JSX, Vite) →
    Bccr.Supen.Ves.Api (.NET 8, Controller → SI.SG → IRequestsHandler) →
    Bccr.Supen.Ves.Mapi (.NET 8, Controller → BW → DA) → SQL Server.
    La UI nunca consulta MAPI, SOAP ni SQL Server directamente.

    El alcance comprende catálogo, listado, detalle, metadatos, archivos y eliminación
    controlada de documentos. Las funcionalidades de comentarios y sus contratos quedan
    excluidos. La seguridad real no se implementa: los 401/403 describen únicamente
    escenarios en un entorno aislado con un proveedor de identidad/permisos simulado.
    No sustituir los mecanismos institucionales vigentes por ese mock.

    Los nombres de campos en inglés son DTOs candidatos, no un cambio autorizado de las
    convenciones C# de los servicios. Contrastar con STI_Documentos, STI_TiposDocumento,
    los procedimientos almacenados y las abstracciones de API y MAPI.

tags:
- name: Document Types
  description: Catálogo de tipos documentales.
- name: Documents
  description: Consulta y mantenimiento de metadatos documentales.
- name: Document Files
  description: Carga y descarga del archivo asociado a un documento.
paths:
  /api/document-types:
    get:
      tags: [Document Types]
      summary: Lista los tipos documentales activos
      description: |
        Devuelve el catálogo de tipos documentales disponibles para clasificar
        documentos. Los tipos inactivos no deben ofrecerse para crear nuevos
        documentos.
      responses:
        '200':
          description: Catálogo de tipos documentales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

      x-ves-target-contract: true
  /api/documents:
    get:
      tags: [Documents]
      summary: Lista documentos con paginación y filtros
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: documentTypeId
        in: query
        schema:
          type: integer
          format: int64
      - name: search
        in: query
        description: Texto de búsqueda según las reglas del módulo documental.
        schema:
          type: string
      responses:
        '200':
          description: Resultado paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDocuments'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

      description: "Respuesta paginada propuesta. ListarDocumentos en la referencia SQL no acredita\npaginación
        o búsqueda textual nativas; aprobar estrategia, orden, total y filtrado\nantes de implementar. Conservar
        condiciones de caducidad y nombre de archivo del\nlegado hasta que negocio apruebe explícitamente un
        cambio."
      x-ves-target-contract: true
    post:
      tags: [Documents]
      summary: Crea los metadatos de un documento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Documento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

      description: "Crear metadatos a través de API → MAPI → BW → DA. El usuario publicador se\nobtiene en
        backend del contexto mock en pruebas; no se acepta desde el navegador.\nGuardarDocumento del SQL de
        referencia presenta riesgos de alta concurrente y\ntratamiento de NULL; verificar la persistencia antes
        de responder 201."
      x-ves-target-contract: true
  /api/documents/{id}:
    parameters:
    - $ref: '#/components/parameters/DocumentId'

    get:
      tags: [Documents]
      summary: Obtiene el detalle de un documento
      responses:
        '200':
          description: Detalle del documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

      x-ves-target-contract: true
    put:
      tags: [Documents]
      summary: Actualiza los metadatos de un documento
      description: |-
        Actualiza exclusivamente metadatos permitidos de STI_Documentos.
        No se define un ciclo DRAFT/PUBLISHED/INACTIVE: el modelo documentado expone
        Publico (S/N), FechaPublicacion y FechaCaduca. Verificar efecto real del
        procedimiento GuardarDocumento, especialmente con NULL y cambios parciales.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentRequest'
      responses:
        '200':
          description: Documento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |-
            Conflicto comprobado de concurrencia o regla de negocio; no se presume un estado documental nuevo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

      x-ves-target-contract: true
    delete:
      tags: [Documents]
      summary: Elimina un documento únicamente cuando la política vigente lo permita
      description: |-
        Operación destructiva condicionada a la confirmación del negocio y de DBA.
        El procedimiento EliminarDocumento de referencia realiza borrado físico; no hay
        evidencia suficiente para prometer desactivación o reversibilidad. Antes de habilitarla:
        validar permiso simulado, titularidad si aplica, actividad/lecturas si se auditan
        realmente, respaldos, exclusiones y política de recuperación. Nunca usar la existencia
        de comentarios como precondición, porque los comentarios están fuera del alcance.
        Si las condiciones no pueden comprobarse, no ejecutar el borrado y devolver un error
        controlado según las reglas acordadas. No asumir que existe estado INACTIVE.
      responses:
        '204':
          description: Documento eliminado físicamente
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No se puede eliminar conforme a las condiciones verificadas de negocio o 
            integridad.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

      x-ves-target-contract: true
  /api/documents/{id}/file:
    parameters:
    - $ref: '#/components/parameters/DocumentId'

    post:
      tags: [Document Files]
      summary: Carga el archivo asociado a un documento
      description: |
        La carga utiliza multipart/form-data.

        Formatos permitidos inicialmente:
        - PDF: .pdf
        - Microsoft Word: .doc, .docx
        - Microsoft Excel: .xls, .xlsx
        - Microsoft PowerPoint: .pptx

        Tamaño máximo inicial por archivo: 25 MB (26,214,400 bytes).

        El backend debe validar tamaño y tipo de archivo aunque el frontend
        aplique las mismas restricciones.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo PDF, DOC, DOCX, XLS, XLSX o PPTX de hasta 25 MB.
                  x-allowed-extensions:
                  - .pdf
                  - .doc
                  - .docx
                  - .xls
                  - .xlsx
                  - .pptx
                  x-max-size-bytes: 26214400
            encoding:
              file:
                contentType: >-
                  application/pdf,
                  application/msword,
                  application/vnd.openxmlformats-officedocument.wordprocessingml.document,
                  application/vnd.ms-excel,
                  application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
                  application/vnd.openxmlformats-officedocument.presentationml.presentation
      responses:
        '200':
          description: Archivo asociado correctamente al documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFileMetadata'
        '400':
          description: Solicitud inválida, archivo ausente o archivo vacío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: El archivo supera el tamaño máximo permitido de 25 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: La extensión o el tipo MIME del archivo no está permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

      x-ves-target-contract: true
    get:
      tags: [Document Files]
      summary: Descarga el archivo asociado a un documento
      description: |
        La descarga debe conservar el nombre del archivo y devolver el Content-Type
        correspondiente al archivo almacenado. La API valida el permiso antes de
        entregar el binario.
      responses:
        '200':
          description: Archivo del documento
          content:
            application/pdf:
              schema: {type: string, format: binary}
            application/msword:
              schema: {type: string, format: binary}
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: {type: string, format: binary}
            application/vnd.ms-excel:
              schema: {type: string, format: binary}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema: {type: string, format: binary}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Documento inexistente o sin archivo asociado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

      x-ves-target-contract: true
components:
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: Datos o parámetros inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Unauthorized:
      description: No existe una identidad simulada en el contexto de la solicitud
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Forbidden:
      description: La identidad simulada no posee el permiso funcional requerido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Conflict:
      description: Conflicto con el estado actual del recurso o una regla de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    InternalError:
      description: Error interno controlado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    DocumentType:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          description: Valor A/I según STI_TiposDocumento (verificar catálogo desplegado).

          enum:
          - A
          - I
    Document:
      type: object
      required:
      - id
      - title
      - summary
      - isPublic
      - publicationDate
      - publishedBy
      properties:
        id:
          type: integer
          format: int64
        documentTypeId:
          type: integer
          format: int64
          nullable: true
          description: CodigoTipoDoc, nullable según SQL de referencia.
        title:
          type: string
          maxLength: 100
        summary:
          type: string
          nullable: false
          maxLength: 255
        isPublic:
          type: boolean
          description: |-
            Visibilidad pública, mapeada a STI_Documentos.Publico (S/N).
            No inferir un estado DRAFT/PUBLISHED/INACTIVE: tal enum no está acreditado por el esquema VES.
        fileName:
          type: string
          nullable: true

          maxLength: 30
        publicationDate:
          type: string
          format: date-time
          description: FechaPublicacion, sin inferir estado adicional.
        expirationDate:
          type: string
          format: date-time
          nullable: true
          description: FechaCaduca; nullable en SQL.
        publishedBy:
          type: string
          description: UsuarioPublica; valor obtenido del backend, no del navegador.
    DocumentSummary:
      allOf:
      - $ref: '#/components/schemas/Document'

    CreateDocumentRequest:
      type: object
      required:
      - title
      - summary
      - isPublic
      - publicationDate
      properties:
        documentTypeId:
          type: integer
          format: int64
          nullable: true
          description: CodigoTipoDoc es nullable en el SQL de referencia. Validar regla funcional antes 
            de exigirlo.
        title:
          type: string
          minLength: 1
          maxLength: 100
        summary:
          type: string
          nullable: false
          maxLength: 255
          description: Resumen es NOT NULL en el SQL de referencia; verificar tratamiento de cadena 
            vacía.
        isPublic:
          type: boolean
          description: "Visibilidad pública, mapeada a STI_Documentos.Publico (S/N).\nNo inferir un estado
            DRAFT/PUBLISHED/INACTIVE: tal enum no está acreditado por el esquema VES."
        publicationDate:
          type: string
          format: date-time
          description: FechaPublicacion (SQL datetime); revisar convención de huso horario y 
            obligatoriedad.
        expirationDate:
          type: string
          format: date-time
          nullable: true
          description: FechaCaduca; nullable en SQL.
      additionalProperties: false

    UpdateDocumentRequest:
      type: object
      minProperties: 1
      properties:
        documentTypeId:
          type: integer
          format: int64
          nullable: true
          description: CodigoTipoDoc es nullable en el SQL de referencia. Validar regla funcional antes 
            de exigirlo.
        title:
          type: string
          minLength: 1
          maxLength: 100
        summary:
          type: string
          nullable: false
          maxLength: 255
          description: Resumen es NOT NULL en el SQL de referencia; verificar tratamiento de cadena 
            vacía.
        isPublic:
          type: boolean
          description: "Visibilidad pública, mapeada a STI_Documentos.Publico (S/N).\nNo inferir un estado
            DRAFT/PUBLISHED/INACTIVE: tal enum no está acreditado por el esquema VES."
        publicationDate:
          type: string
          format: date-time
          description: FechaPublicacion (SQL datetime); revisar convención de huso horario y 
            obligatoriedad.
        expirationDate:
          type: string
          format: date-time
          nullable: true
          description: FechaCaduca; nullable en SQL.
      additionalProperties: false

    PagedDocuments:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    DocumentFileMetadata:
      type: object
      required:
      - fileName
      - contentType
      - fileSize
      properties:
        fileName:
          type: string
        contentType:
          type: string
          description: MIME type almacenado para el archivo.
        fileSize:
          type: integer
          format: int64
          minimum: 0
          maximum: 26214400

    ApiError:
      type: object
      description: |
        Formato JSON común para errores. La documentación exige consistencia,
        pero no fija todavía un catálogo definitivo de códigos de error.
      required:
      - message
      properties:
        code:
          type: string
          nullable: true
        message:
          type: string
        details:
          type: array
          nullable: true
          items:
            type: string
